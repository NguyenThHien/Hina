name: hina_mobile
description: Hina - trợ lý cho người khiếm thị (client; AI chạy phía server).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0" # Flutter 3.27+ (Color.withValues)

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  camera: ^0.11.0
  record: ^7.1.0
  flutter_tts: ^4.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Quicksand Regular 400 (SIL OFL, xem assets/fonts/OFL.txt), theo prototype. Đủ dấu tiếng Việt.
  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
